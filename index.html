<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCart — Shop Smart. Live Better. | Premium E-Commerce</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="NovaCart is a modern premium shopping platform featuring curated electronics, designer apparel, luxury timepieces, and artisan home essentials.">
  <meta name="theme-color" content="#4f46e5">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z'/><path d='M3 6h18' stroke='%23ffffff' stroke-width='2'/></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            heading: ['Outfit', '"Plus Jakarta Sans"', 'sans-serif']
          },
          screens: {
            'xs': '480px',
          }
        }
      }
    }
  </script>

  <!-- Confetti Canvas Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom NovaCart Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- App Mount Root -->
  <div id="app" class="flex-1 flex flex-col">
    <!-- Rendered dynamically by Router -->
  </div>

  <!-- Toast Notification Stack Container -->
  <div id="toast-container"></div>

  <!-- Modal Mounts -->
  <div id="quick-view-container"></div>
  <div id="auth-modal-container"></div>

  <!-- Application Logic Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
